
services:
  # MongoDB Database Service
  mongodb:
    image: mongo:6.0.4
    container_name: blog-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - blog-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js and Express Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mern-blog-backend:1.0
    container_name: blog-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: mongodb://mongodb:27017/blog
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - blog-network

  # React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: http://localhost:3000/api/v1
    image: mern-blog-frontend:1.0
    container_name: blog-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - blog-network

# Persistent MongoDB Storage
volumes:
  mongo_data:

# Application Network
networks:
  blog-network:
    driver: bridge
